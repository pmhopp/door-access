<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Door Access Login</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding-top: 15vh; background-color: #f4f4f9; }
    .login-box { background: white; padding: 30px; margin: 0 auto; max-width: 320px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1b5e20; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Club Access</h2>
  <form id="accessForm">
    <input type="email" id="email" placeholder="Enter your email" required><br>
    <input type="password" id="passcode" placeholder="Enter your passcode" required><br>
    <button type="submit">Unlock Door</button>
  </form>
  <p id="responseMessage" style="margin-top: 15px; font-weight: bold;"></p>
</div>

<script>
  // Replace with your Google Apps Script Web App /exec URL
  const scriptUrl = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

  document.getElementById("accessForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const email = document.getElementById("email").value;
    const passcode = document.getElementById("passcode").value;
    const msg = document.getElementById("responseMessage");

    msg.style.color = "#333";
    msg.innerText = "Validating...";

    // Send data to your Google Apps Script backend
    fetch(scriptUrl, {
      method: "POST",
      mode: "no-cors", // Required for cross-origin Apps Script calls
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, passcode: passcode })
    })
    .then(() => {
      msg.style.color = "#2e7d32";
      msg.innerText = "Request sent! Check door status.";
    })
    .catch((err) => {
      msg.style.color = "#c62828";
      msg.innerText = "Connection error. Please try again.";
    });
  });
</script>

</body>
</html>
